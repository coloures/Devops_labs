# Nginx отдаёт результаты скрапера по HTTP: /results/<job_id>.json
# Каталог результатов смонтирован в контейнер только для чтения
# (см. deploy/compose.yaml), Nginx никогда в него не пишет.
server {
    listen 80;
    server_name _;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location /results/ {
        root /usr/share/nginx/html;
        autoindex on;
        types {
            application/json json;
            text/plain txt;
        }
        default_type application/octet-stream;
    }
}
