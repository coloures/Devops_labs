# Redis как очередь заданий для скрапера (Redis Streams).
# Задание — запись в stream `jobs`, consumer group создаёт сам воркер.
#
# Порт наружу НЕ публикуется (см. deploy/compose.yaml), Redis виден только
# изнутри compose-сети, поэтому слушаем 0.0.0.0: иначе контейнер-воркер
# не сможет подключиться (по умолчанию Redis слушает только loopback).
bind 0.0.0.0
protected-mode no

# AOF: журнал операций. Без него stream `jobs` и список неподтверждённых
# записей (PEL) не пережили бы перезапуск контейнера Redis.
appendonly yes
appenddirname appendonlydir
appendfilename "appendonly.aof"
appendfsync everysec

# Каталог данных — это том redis-data (deploy/compose.yaml -> /data).
dir /data

# RDB-снапшоты выключаем: источник истины — AOF.
save ""
