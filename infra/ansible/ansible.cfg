[defaults]
# Путь к ролям — относительно каталога запуска ansible-playbook (infra/ansible).
roles_path = roles

# Inventory НЕ задаём: он передаётся через -i. CI использует
# inventories/hosts.example.yml, локально — сгенерированный
# inventories/lab/hosts.yml.
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
display_skipped_hosts = False
stdout_callback = default

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
