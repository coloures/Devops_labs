---
# Роль docker_engine: Docker Engine, Buildx и Compose plugin из официального
# apt-репозитория Docker. Архитектура не зашита — берётся из ansible_architecture.
# Пользователь admin НЕ добавляется в группу docker (см. последние две задачи).

- name: Map the host architecture to Docker's package architecture
  ansible.builtin.set_fact:
    docker_arch: >-
      {{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_architecture, ansible_architecture) }}

- name: Install the packages needed to add a third-party apt repository
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: Create the apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker's official GPG key
  ansible.builtin.get_url:
    url: "{{ docker_apt_key_url }}"
    dest: "{{ docker_apt_keyring }}"
    owner: root
    group: root
    mode: "0644"
  notify: Update the apt cache

- name: Add Docker's official apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_arch }} signed-by={{ docker_apt_keyring }}]
      {{ docker_apt_repository_url }} {{ ansible_distribution_release }} stable
    filename: docker
    state: present
  notify: Update the apt cache

# Обновляем кэш apt сразу после добавления репозитория, до установки пакетов.
# На повторном запуске репозиторий не меняется, handler не срабатывает — и
# apt-get update не выполняется, поэтому changed=0.
- name: Refresh the apt cache after changing the Docker repository
  ansible.builtin.meta: flush_handlers

- name: Install Docker Engine, Buildx and the Compose plugin
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present

- name: Ensure the Docker service is enabled and running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Read the supplementary groups of the admin user
  ansible.builtin.command:
    cmd: id -nG {{ admin_user }}
  register: docker_admin_groups
  changed_when: false

- name: Make sure the admin user is NOT in the docker group
  ansible.builtin.command:
    cmd: gpasswd --delete {{ admin_user }} docker
  when: "'docker' in docker_admin_groups.stdout.split()"
  changed_when: true
